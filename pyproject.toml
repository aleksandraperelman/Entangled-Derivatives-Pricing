[project]
name = "entangled-pricing"
version = "0.1.0"
description = "Entangled pricing with quantum/ML baselines"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "qiskit",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]